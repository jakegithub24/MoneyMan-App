<!-- 
  ===================================================================
  FEATURE FLAG MODULE: Auto Switch to Mobile Fullscreen (Native App View)
  ===================================================================
  This is a dedicated, self-contained feature component.
  To disable or remove this feature in production:
  1. Set environment variable FEATURE_AUTO_FULLSCREEN=false
  2. Or simply delete this file/directory; base.html uses 'ignore missing'.
  ===================================================================
-->

<!-- Mobile Native PWA Meta Tags & Manifest -->
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MoneyMan Native"/>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22MoneyMan%20Native%22%2C%22short_name%22%3A%22MoneyMan%22%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f9f9f9%22%2C%22theme_color%22%3A%22%230d631b%22%7D"/>

<!-- Mobile Floating Fullscreen Control Widget -->
<div id="mobile-fullscreen-widget" class="md:hidden fixed top-3 right-3 z-50 transition-all duration-300 transform translate-y-0 opacity-100">
    <button id="fullscreenToggleBtn" 
            onclick="window.toggleMobileFullscreen()" 
            title="Toggle Native Fullscreen Mode"
            class="glass-panel text-on-surface dark:text-text-main-dark border border-outline-variant/30 dark:border-white/20 p-2.5 rounded-full shadow-lg flex items-center gap-1.5 active:scale-90 transition-all hover:bg-surface-container/80">
        <span id="fullscreenIcon" class="material-symbols-outlined text-[20px] text-primary dark:text-primary-fixed">fullscreen</span>
        <span id="fullscreenBadgeText" class="text-[11px] font-bold tracking-wide pr-1 hidden sm:inline">Native</span>
    </button>
</div>

<!-- Fullscreen Auto-Switch Script -->
<script id="feature-auto-fullscreen-script">
(function() {
    'use strict';

    function isMobileViewport() {
        return window.innerWidth <= 768 || ('ontouchstart' in window || navigator.maxTouchPoints > 0);
    }

    function isFullscreenActive() {
        return !!(document.fullscreenElement || 
                  document.webkitFullscreenElement || 
                  document.mozFullScreenElement || 
                  document.msFullscreenElement);
    }

    function isFeatureEnabled() {
        return localStorage.getItem('feature_auto_fullscreen') !== 'disabled';
    }

    async function requestNativeFullscreen() {
        if (!isMobileViewport() || !isFeatureEnabled() || isFullscreenActive()) return;
        const docElem = document.documentElement;
        try {
            if (docElem.requestFullscreen) {
                await docElem.requestFullscreen();
            } else if (docElem.webkitRequestFullscreen) {
                await docElem.webkitRequestFullscreen();
            } else if (docElem.mozRequestFullScreen) {
                await docElem.mozRequestFullScreen();
            } else if (docElem.msRequestFullscreen) {
                await docElem.msRequestFullscreen();
            }
        } catch (err) {
            console.debug('Native Fullscreen request info:', err.message || err);
        }
    }

    async function exitNativeFullscreen() {
        try {
            if (document.exitFullscreen) {
                await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                await document.webkitExitFullscreen();
            } else if (document.mozCancelFullScreen) {
                await document.mozCancelFullScreen();
            } else if (document.msExitFullscreen) {
                await document.msExitFullscreen();
            }
        } catch (err) {
            console.debug('Native Fullscreen exit info:', err.message || err);
        }
    }

    function updateFullscreenUI() {
        const icon = document.getElementById('fullscreenIcon');
        const badgeText = document.getElementById('fullscreenBadgeText');
        const active = isFullscreenActive();

        if (icon) {
            icon.textContent = active ? 'fullscreen_exit' : 'fullscreen';
        }
        if (badgeText) {
            badgeText.textContent = active ? 'Exit Native' : 'Native View';
        }
        
        if (active) {
            sessionStorage.setItem('native_app_mode_active', 'true');
        }
    }

    window.toggleMobileFullscreen = function() {
        if (isFullscreenActive()) {
            localStorage.setItem('feature_auto_fullscreen_user_exited', 'true');
            sessionStorage.removeItem('native_app_mode_active');
            exitNativeFullscreen();
        } else {
            localStorage.removeItem('feature_auto_fullscreen_user_exited');
            sessionStorage.setItem('native_app_mode_active', 'true');
            requestNativeFullscreen();
        }
    };

    window.requestNativeFullscreen = requestNativeFullscreen;
    window.isMobileFullscreen = isFullscreenActive;

    function setupAutoSwitchListeners() {
        if (!isMobileViewport() || !isFeatureEnabled()) return;

        requestNativeFullscreen();

        const handleUserTouchInteraction = () => {
            if (!isFullscreenActive() && 
                isFeatureEnabled() && 
                localStorage.getItem('feature_auto_fullscreen_user_exited') !== 'true') {
                requestNativeFullscreen();
            }
        };

        ['pointerdown', 'touchstart', 'click'].forEach(evtType => {
            window.addEventListener(evtType, handleUserTouchInteraction, { capture: true, passive: true });
        });

        document.addEventListener('click', (e) => {
            const target = e.target.closest('a, button, [role="button"]');
            if (target && isMobileViewport() && isFeatureEnabled()) {
                requestNativeFullscreen();
            }
        }, { capture: true });
    }

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evtName => {
        document.addEventListener(evtName, () => {
            updateFullscreenUI();
        });
    });

    setupAutoSwitchListeners();
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            setupAutoSwitchListeners();
            updateFullscreenUI();
        });
    } else {
        updateFullscreenUI();
    }
})();
</script>
